name: Linux ARM64 beta compatibility probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    name: Native Linux ARM64 musl / Rust 1.85.0
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 82e648a4abd8a6bd0d61cf189af86871102059fd
      - name: Bind the candidate and its published crate on the native host
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD)" = 82e648a4abd8a6bd0d61cf189af86871102059fd
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install 1.85.0 --profile minimal --target aarch64-unknown-linux-musl
          cargo +1.85.0 fetch --locked
          cargo +1.85.0 metadata --frozen --format-version=1 > "$RUNNER_TEMP/dependencies.json"
          src="$(python3 scripts/qleisli_dependency.py --metadata "$RUNNER_TEMP/dependencies.json" --manifest-path Cargo.toml)"
          echo "QLEISLI_SOURCE_ROOT=$src" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/lean-setup"
          cp "$src"/lean-kernel/{lean-toolchain,lakefile.toml,lake-manifest.json} "$RUNNER_TEMP/lean-setup/"
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: ${{ runner.temp }}/lean-setup
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build and audit the ARM64 native checker from the registry source
        run: |
          python3 -B "$QLEISLI_SOURCE_ROOT/scripts/package_lean_kernel.py" --validation full --output "$RUNNER_TEMP/arm-kernel"
          echo "QLEISLI_KERNEL=$RUNNER_TEMP/arm-kernel/bin/qleisli-kernel" >> "$GITHUB_ENV"
      - name: Run the full ARM64 musl bundle and integration tests
        run: cargo +1.85.0 test --frozen --workspace --all-targets --target aarch64-unknown-linux-musl
      - name: Verify architecture, static linkage and nonempty checked qrates
        run: |
          cargo +1.85.0 build --frozen --bins --target aarch64-unknown-linux-musl
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from distribution import binary_platform
          from verify_release import TOOLS
          for tool in TOOLS:
              binary_platform((Path("target/aarch64-unknown-linux-musl/debug") / tool).read_bytes(), "aarch64-unknown-linux-musl")
          PY
          python3 scripts/verify_release.py --source-root . --bin-dir target/aarch64-unknown-linux-musl/debug --qleisli-source-root "$QLEISLI_SOURCE_ROOT"
      - name: Retain the exact dependency and native checker records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-arm64-beta-inputs
          path: |
            ${{ runner.temp }}/dependencies.json
            ${{ runner.temp }}/arm-kernel/manifest.json
