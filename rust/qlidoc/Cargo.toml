# Developer-only Rust build configuration. Qlirgo never reads or executes this.
[package]
name = "qlidoc-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Syntax-only Qleisli Markdown documentation engine"

[lib]
path = "lib.rs"

[dependencies]
qleisli = "=0.3.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
rustix = { version = "=1.1.3", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"

[[bin]]
name = "qlidoc"
path = "../../qrates/qlidoc/src/bin/qlidoc.rs"

[[test]]
name = "engine"
path = "../../qrates/qlidoc/tests/engine.rs"
